<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="shortcut icon" href="./assets/images/logo.ico" type="image/x-icon">
  <link rel="stylesheet" href="./assets/CSS/style.css">
  <link rel="stylesheet" href="./assets/CSS/index.css">
</head>
<body>
  <main class="admin-login-shell">
    <section class="admin-login-panel">
      <div>
        <p class="admin-login-kicker">Admin Access</p>
        <h1 class="admin-login-title">Welcome Back</h1>
      </div>
      <form class="admin-login-form" id="admin-login-form">
        <input type="text" id="loginInput" placeholder="Email or Username" autocomplete="username" />
        <div class="admin-password-field">
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
          <button type="button" class="admin-password-toggle" data-password-toggle aria-label="Show password">
            <ion-icon name="eye-outline"></ion-icon>
          </button>
        </div>
        <button type="submit" class="admin-login-submit">Open Admin Editor</button>
      </form>

      <p class="admin-login-status" id="error"></p>
    </section>
  </main>

  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script type="module" src="./assets/js/index.js"></script>
</body>
</html>
