<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --text: #f3f4f6;
      --accent: #f0b429;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(240, 180, 41, 0.10), transparent 38%),
        linear-gradient(180deg, #11162a 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Poppins, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
    }

    .page {
      width: min(100%, 1200px);
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      justify-items: center;
      align-content: center;
      gap: 18px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 76px;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(240, 180, 41, 0.35);
      background: rgba(240, 180, 41, 0.12);
      color: #f8d56f;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.1;
    }

    .image-shell {
      width: min(100%, 1120px);
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 28px;
      background: rgba(0, 0, 0, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .image-shell img {
      display: block;
      width: min(100%, 1000px);
      max-height: calc(100vh - 180px);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main class="page">
    <span class="badge">404</span>
    <h1>Page Not Found</h1>
    <section class="image-shell" aria-label="404 illustration">
      <img src="./assets/images/404.gif" alt="404 not found animation">
    </section>
  </main>
</body>
</html>
